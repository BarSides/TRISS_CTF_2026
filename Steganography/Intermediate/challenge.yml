# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Nesting Dolls"
author: "justinforbes"
attribution: "BarSides"
category: "Steganography"
description: |-
  A postcard from Pittsburgh turned up in the BarSides mailbox, signed by our
  old friend The Bridge Keeper. The front is a nice view of the Point, but the
  card is suspiciously heavy for a picture this simple. There's more to this
  postcard than its front.

  Flag format: BarSides{...}
value: 250
type: standard

flags:
  - BarSides{postcards_have_two_sides}

tags:
  - intermediate
  - image
  - file-carving

files:
  - files/postcard.jpg

hints:
  - content: "A JPEG ends with the bytes FF D9. Image viewers stop reading there, but nothing stops someone from adding more data after it. What else is inside this file?"
    cost: 0
  - content: "Photos carry metadata (EXIF) about the camera and the picture. Try CyberChef's Extract EXIF operation, or exiftool."
    cost: 25
  - content: "The extra data is a password-protected ZIP. In CyberChef, run Unzip on the whole file and put the password from the EXIF in the Password box. Renaming the file to .zip and opening it with 7-Zip also works."
    cost: 50

requirements: []

state: visible
version: "1.0"
