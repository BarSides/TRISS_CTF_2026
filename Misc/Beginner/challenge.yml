# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Box Score"
author: "justinforbes"
attribution: "BarSides"
category: "Misc"
description: |-
  The Pittsburgh Pierogies' media office sent this spreadsheet to every
  reporter in the press box. The front office swears it only held the
  roster and season stats.

  A sports writer thinks there was more in it than that. Take a look.

  Flag format: BarSides{...}
value: 100
type: standard

flags:
  - BarSides{hidden_sheets_still_get_emailed}

tags:
  - beginner
  - office

files:
  - files/box_score.xlsx

hints:
  - content: "Spreadsheets can hide whole sheets. In Excel, right click a sheet tab and choose Unhide. In LibreOffice Calc, use Sheet > Show Sheet."
    cost: 0
  - content: "White text on a white background is still text. Click the empty looking cell and read the formula bar."
    cost: 10

requirements: []

state: visible
version: "1.0"
