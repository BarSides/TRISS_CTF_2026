# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Where Was This?"
author: "justinforbes"
attribution: "BarSides"
category: "OSINT"
description: |-
  The night before TRISS, one of the BarSides crew posted this photo with the
  caption "Pre-game's here, come find us." No bar name, no address, no reply
  to anyone asking where "here" is.

  Phones remember more than people say. Work out the street address where the
  photo was taken. There's no Internet at the venue, so a map of the
  neighborhood is attached.

  Flag format: BarSides{housenumber_streetname} in lowercase,
  for example BarSides{1234_example_street}
value: 100
type: standard

flags:
  - type: static
    content: BarSides{4901_hatfield_street}
    data: case_insensitive
  - type: static
    content: BarSides{4901_hatfield_st}
    data: case_insensitive

tags:
  - beginner
  - osint
  - exif

files:
  - files/pregame.jpg
  - files/lawrenceville_map.png

hints:
  - content: "Photos from phones usually carry EXIF metadata, sometimes including GPS. CyberChef's Extract EXIF operation reads it, as do exiftool and most image viewers' properties panels."
    cost: 0
  - content: "GPSLatitude and GPSLongitude are decimal degrees. Find the lines on the map just either side of each value, and the faint lines every 0.0001 degrees narrow it down to a single lot."
    cost: 10

requirements: []

state: visible
version: "1.0"
