# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Ride All Day"
author: "justinforbes"
attribution: "BarSides"
category: "Mobile"
description: |-
  Kennywood's gate staff scan ride-all-day wristbands with this app. After
  someone pulled the check out of last year's version with a decompiler,
  the night crew moved it into native code. Now the Java just hands your
  code to a C library and waits for a yes or no.

  The only wristband code the gate accepts is the flag. Work out what the
  native check wants and run it backwards. No phone needed.

  Flag format: BarSides{...}
value: 500
type: standard

flags:
  - BarSides{native_code_still_rides_free}

tags:
  - advanced
  - mobile
  - android
  - native

files:
  - files/ride_all_day.apk

hints:
  - content: "jadx shows Gate.scan() is a native method in the library \"wristband\". An APK is a zip: unzip it and open lib/x86_64/libwristband.so in Ghidra."
    cost: 0
  - content: "Start at the exported function Java_org_barsides_rideallday_Gate_scan. The calls through the JNIEnv pointer just fetch your string. The interesting part is the 38-step loop that compares against a table in .rodata."
    cost: 50
  - content: "Each byte is XORed with an 8-byte key, rotated left by 3 bits, then has 17*i added. Undo those steps in reverse order for every byte of the expected table."
    cost: 100

requirements: []

state: visible
version: "1.0"
