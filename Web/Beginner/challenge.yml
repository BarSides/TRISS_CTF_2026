# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Staff Only"
author: "justinforbes"
attribution: "BarSides"
category: "Web"
description: |-
  The Great Pierogi Race fan site has a secret backstage page where the racers
  pick up their passes. It isn't linked anywhere, and the site's staff swear
  that only staff can get in. Find the backstage page and talk your way past
  the door.

  Flag format: BarSides{...}
value: 100
type: standard

connection_info: http://EVENT_HOST:8004

flags:
  - BarSides{robots_txt_is_a_map_not_a_lock}

tags:
  - beginner
  - robots.txt
  - cookies

files: []

hints:
  - content: "Websites keep a file that tells search engine robots which pages they may not visit. It lives at the same path on almost every site: /robots.txt"
    cost: 0
  - content: "The backstage page decides who is staff by reading a cookie your browser sends. Open developer tools (F12), go to Storage (Firefox) or Application (Chrome), find the cookie and change its value."
    cost: 10

requirements: []

state: visible
version: "1.0"
