# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Skybox"
author: "justinforbes"
attribution: "BarSides"
category: "Pwn"
description: |-
  The suite level at Acrisure Stadium has its own access terminal. Punch in
  your code and it decides whether you belong up there. The code goes into a
  fixed-size buffer with no bounds check, so a long enough entry runs off the
  end and over the address the program planned to return to. Somewhere in the
  binary is an open_skybox routine the normal path never calls -- point the
  return address at it and the suite is yours.

  The exact binary the server runs is attached.

  Connect with: nc EVENT_HOST 8013

  Flag format: BarSides{...}
value: 250
type: standard

# Raw TCP line service (socat), not a web page.
connection_info: EVENT_HOST 8013

flags:
  - BarSides{returned_to_the_skybox}

tags:
  - intermediate
  - pwn
  - ret2win
  - buffer-overflow

files:
  - files/skybox

hints:
  - content: "There is a function (open_skybox) that prints the flag but is never called. Find its address with nm, objdump, or Ghidra, then overflow the input so the program returns into it."
    cost: 0
  - content: "The return address sits 72 bytes into your input. In Python: pwn-style payload b'A'*72 + p64(address_of_open_skybox). The binary is not PIE, so the address is fixed; no canary is in the way."
    cost: 25

requirements: []

state: visible
version: "1.0"
