description: |-
  A colleague managed an internal server at our company. He had it set up so that employees could update the message of the day with their favorite quotes. We all enjoyed logging in each day and seeing what was new. Not too long ago, right after putting it up on GitHub, something got him spooked. He revoked all our access, and deleted the repo. Actually, he want as far as to delete his entire GitHub profile. Rumor has it someone leaked some sensitive information, but I sure didn't see evidence of that. Just quotes, years and years of quotes.
