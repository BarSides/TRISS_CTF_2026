# ctfcli challenge spec: https://github.com/CTFd/ctfcli
name: "Blow on the Cartridge"
author: "justinforbes"
attribution: "BarSides"
category: "Rev"
description: |-
  Found in a Homestead basement: a STEELBOX 87, the 8-bit console nobody
  remembers, and a cartridge of "Mill Hunk 2: Return to Homestead". The
  game asks for a cheat code at the title screen. Legend says the code
  gives you 99 lives.

  We dumped the cartridge to `cheat.rom` and wrote down the console's
  emulator, `steelbox`. The console's CPU is not anything you have seen
  before. Learn its instruction set from the emulator, read the cartridge,
  and recover the cheat code. The cheat code is the flag.

  Run it on Linux (Kali, Ubuntu 22.04 or newer, or WSL):
  `./steelbox cheat.rom`

  Flag format: BarSides{...}
value: 500
type: standard

flags:
  - BarSides{eight_bit_cheat_codes_never_die}

tags:
  - advanced
  - linux
  - ghidra
  - vm

files:
  - files/steelbox
  - files/cheat.rom

hints:
  - content: "The emulator is a loop around a big switch on one byte from the ROM. In Ghidra, each case of that switch is one instruction of the STEELBOX CPU. Write down each opcode, how many bytes follow it, and what it does to the registers."
    cost: 0
  - content: "The ROM starts with an 8-byte header (STLBOX87) and is loaded at address 0. Once you know the opcodes, a 30-line Python disassembler shows that the check is the same handful of instructions repeated once per character."
    cost: 50
  - content: "Each character is mixed with the previous character, so solve them in order. For each position, try all 256 byte values in your own copy of those instructions and keep the one that matches the CHK constant."
    cost: 100

requirements: []

state: visible
version: "1.0"
